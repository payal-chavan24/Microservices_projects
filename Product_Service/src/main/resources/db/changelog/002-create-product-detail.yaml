databaseChangeLog:
  - changeSet:
      id: 002-create-product-detail
      author: payal
      changes:
        - createTable:
            tableName: product_detail
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(1000)
              - column:
                  name: brand
                  type: VARCHAR(255)
              - column:
                  name: warranty
                  type: VARCHAR(255)
        - addColumn:
            tableName: products
            columns:
              - column:
                  name: product_detail_id
                  type: BIGINT
                  constraints:
                    nullable: true
        - addForeignKeyConstraint:
            baseTableName: products
            baseColumnNames: product_detail_id
            constraintName: fk_products_product_detail
            referencedTableName: product_detail
            referencedColumnNames: id
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: products
            constraintName: fk_products_product_detail
        - dropColumn:
            columnName: product_detail_id
            tableName: products
        - dropTable:
            tableName: product_detail
